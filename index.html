<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>APIS</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0B57D0"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><script src="https://accounts.google.com/gsi/client" async defer></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F7FC;--card:#fff;--tx:#0F1E3D;--mu:#6B7A99;--bl:#0B57D0;--bd:#0942A0;--or:#F5A623;--od:#C97F0A;--gr:#2EB872;--rd:#E5484D;--ln:#E2E8F3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1426;--card:#16213A;--tx:#EAF0FF;--mu:#93A2C4;--ln:#26345A}}
:root[data-theme="dark"]{--bg:#0C1426;--card:#16213A;--tx:#EAF0FF;--mu:#93A2C4;--ln:#26345A}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:700 15px/1.45 Nunito,system-ui,Arial,sans-serif}
.app{display:flex;min-height:100vh}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:2px solid var(--ln);z-index:5;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;color:var(--mu);font:800 11px Nunito,sans-serif;padding:6px 0;border-radius:12px;cursor:pointer}
nav button i{display:block;font-style:normal;font-size:22px}nav button.on{color:var(--bl);background:rgba(11,87,208,.1)}
.brand{display:none}
main{flex:1;padding:14px 14px 96px;max-width:900px;margin:0 auto;width:100%}
@media(min-width:900px){nav{top:0;bottom:auto;width:220px;right:auto;flex-direction:column;border-top:0;border-right:2px solid var(--ln);padding:18px 12px;gap:4px;height:100vh}
nav button{text-align:left;font-size:15px;padding:12px 14px}nav button i{display:inline;margin-right:10px;font-size:19px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:24px;color:var(--bl);letter-spacing:3px;margin-bottom:14px}.brand img{width:40px;height:40px;border-radius:50%}
main{margin-left:220px;padding:24px 28px 40px}}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.top h1{font-size:24px;margin:0;font-weight:900}
.av{width:44px;height:44px;border-radius:50%;border:3px solid var(--bl);background:var(--bl) center/cover;color:#fff;font-weight:900;display:grid;place-items:center;cursor:pointer;overflow:hidden}
.card{background:var(--card);border:2px solid var(--ln);border-radius:18px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:17px;font-weight:900}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.stat{text-align:center}.stat b{display:block;font-size:28px;font-weight:900;color:var(--bl)}.stat span{color:var(--mu);font-size:12px}
.btn{border:0;border-radius:14px;padding:11px 18px;font:900 14px Nunito,sans-serif;letter-spacing:.5px;text-transform:uppercase;color:#fff;background:var(--bl);box-shadow:0 4px 0 var(--bd);cursor:pointer;margin:2px 4px 6px 0}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--bd)}.btn.or{background:var(--or);box-shadow:0 4px 0 var(--od)}.btn.gr{background:var(--gr);box-shadow:0 4px 0 #1C8A52}.btn.gh{background:var(--card);color:var(--bl);border:2px solid var(--ln);box-shadow:0 4px 0 var(--ln)}.btn.sm{padding:7px 12px;font-size:12px}
input,select,textarea{width:100%;padding:11px 12px;border:2px solid var(--ln);border-radius:12px;background:var(--bg);color:var(--tx);font:700 15px Nunito,sans-serif;margin:3px 0 9px}
label{font-size:12px;color:var(--mu);font-weight:800;text-transform:uppercase}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:900;background:var(--ln);margin:0 4px 4px 0}
.High{background:#FDE3E4;color:#B3262B}.Medium{background:#FFF0D1;color:#935F00}.Low{background:#E1F5EA;color:#1C7A4A}.Completed{background:#E1F5EA;color:#1C7A4A}
.alert{background:#FDE3E4;color:#B3262B;border-radius:14px;padding:10px 14px;margin-bottom:8px;font-weight:800}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.mu{color:var(--mu);font-size:13px}.sp{flex:1}
.hero{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,var(--bl),#3B82F6);color:#fff;border-radius:22px;padding:16px;margin-bottom:12px}
.hero img{width:96px;border-radius:16px;background:#f2f0ec}.hero h2{margin:0 0 4px;font-size:22px;font-weight:900}
.bar{height:14px;border-radius:8px;background:var(--ln);overflow:hidden;margin:3px 0}.bar i{display:block;height:100%;background:var(--bl);border-radius:8px}.bar i.t{background:var(--or)}
.cols{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}.col{min-width:230px;flex:1}
.pimg{width:100%;border-radius:14px;margin-top:8px;max-height:420px;object-fit:cover}
.cover{height:110px;border-radius:18px 18px 0 0;background:linear-gradient(120deg,var(--bl),var(--or))}
.pav{width:92px;height:92px;margin:-46px 0 0 14px;border:4px solid var(--card);font-size:30px}
#modal{position:fixed;inset:0;background:rgba(10,20,45,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.on{display:flex}#modal .sheet{background:var(--card);width:100%;max-width:520px;max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px}
@media(min-width:900px){#modal{align-items:center}#modal .sheet{border-radius:24px}}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:14px;z-index:30;display:none}
.tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
</style></head><body>

const idb=new Promise(r=>{try{const q=indexedDB.open('apis',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
async function persist(){try{const d=await idb;if(d)d.transaction('k','readwrite').objectStore('k').put(S,'state');else localStorage.setItem('apis',JSON.stringify(S))}catch(e){toast('Storage full or blocked')}}
async function save(){S.updated=Date.now();await persist();if(tok&&Date.now()<tokExp){clearTimeout(pushT);pushT=setTimeout(()=>push().catch(()=>{}),2500)}}
async function load(){try{const d=await idb;let v=null;if(d)v=await new Promise(r=>{const q=d.transaction('k').objectStore('k').get('state');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)});else v=JSON.parse(localStorage.getItem('apis')||'null');if(v)S={...S,...v}}catch(e){}}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2600)}
/* ---- helpers ---- */
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
function fld(f,v=''){const n=f.n,o=f.o;let i;if(o)i=`<select id="f_${n}">${o.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('')}</select>`;else if(f.t=='area')i=`<textarea id="f_${n}" rows="3">${esc(v)}</textarea>`;else i=`<input id="f_${n}" type="${f.t||'text'}" value="${esc(v)}" ${f.t=='file'?'accept="image/*"':''}>`;return`<label>${f.l||n}</label>${i}`}
function form(title,fs,cb,vals={},label='Save'){$('#sheet').innerHTML=`<h3>${title}</h3>${fs.map(f=>fld(f,vals[f.n]??f.d??'')).join('')}<button class="btn" id="ok">${label}</button><button class="btn gh" onclick="closeM()">Cancel</button>`;$('#modal').classList.add('on');
$('#ok').onclick=async()=>{const r={};for(const f of fs){const el=$('#f_'+f.n);r[f.n]=f.t=='file'?(el.files[0]?await img(el.files[0]):''):el.value.trim()}const err=await cb(r);if(err)toast(err);else closeM()}}
function closeM(){$('#modal').classList.remove('on')}
$('#modal').onclick=e=>{if(e.target.id=='modal')closeM()};
function img(file,max=900){return new Promise(r=>{const i=new Image;i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.75))};i.src=URL.createObjectURL(file)})}
const pct=r=>+r.target?Math.round(+r.actual/+r.target*100):0;
/* ---- views ---- */
const TABS=[['home','🏠','Home'],['eod','✅','EOD'],['terr','📊','Territory'],['pipe','🤝','Pipeline'],['rep','✉️','Report'],['me','👤','Profile']];
function nav(){$('#nav').innerHTML=`<div class="brand"><img src="${LOGO}" alt="">APIS</div>`+TABS.map(t=>`<button class="${tab==t[0]?'on':''}" onclick="go('${t[0]}')"><i>${t[1]}</i>${t[2]}</button>`).join('')}
function go(t){tab=t;render();scrollTo(0,0)}
function top(t){const p=S.profile;return`<div class="top"><h1>${t}</h1><div class="av pr" style="${p.avatar?`background-image:url(${p.avatar})`:''}" onclick="go('me')">${p.avatar?'':esc(p.name[0])}</div></div>`}
function streak(){const ds=new Set(S.logs.map(l=>l.date));let n=0,d=new Date();if(!ds.has(d.toISOString().slice(0,10)))d.setDate(d.getDate()-1);while(ds.has(d.toISOString().slice(0,10))){n++;d.setDate(d.getDate()-1)}return n}
function alerts(){const a=[];S.terr.filter(r=>r.date==today()&&pct(r)<80).forEach(r=>a.push(`${r.route} is at ${pct(r)}% of target`));S.terr.filter(r=>r.date==today()&&r.stock=='Y').forEach(r=>a.push(`Stock-out on ${r.route}: ${r.items}`));S.leads.filter(l=>l.stage!='Sanctioned'&&l.next&&l.next<today()).forEach(l=>a.push(`Overdue: ${l.company} – ${l.action}`));return a}
function home(){const tl=S.logs.filter(l=>l.date==today()),dn=tl.filter(l=>l.status=='Completed').length,al=alerts(),h=new Date().getHours();
return top('Home')+`<div class="hero"><img src="${MASCOT}" alt=""><div><h2>${h<12?'Good morning':h<18?'Good afternoon':'Good evening'}, ${esc(S.profile.name.split(' ')[0])}!</h2><div>🔥 ${streak()}-day logging streak<br>Small steps. Big progress.</div></div></div>
<div class="grid"><div class="card stat"><b>${tl.length}</b><span>Logged today</span></div><div class="card stat"><b>${dn}</b><span>Completed</span></div><div class="card stat"><b>${S.leads.filter(l=>l.stage!='Sanctioned').length}</b><span>Open leads</span></div><div class="card stat"><b>${S.appr.length}</b><span>Career wins</span></div></div>
${al.map(x=>`<div class="alert">⚠️ ${esc(x)}</div>`).join('')}
<div class="card"><h3>Quick add</h3><button class="btn" onclick="addLog()">+ Task</button><button class="btn or" onclick="addTerr()">+ Route</button><button class="btn gr" onclick="addLead()">+ Lead</button><button class="btn gh" onclick="addPost()">+ Post</button></div>
${S.posts.length&&(Date.now()-S.posts[0].ts<2592e6)?'':`<div class="card mu">💡 No portfolio update in 30 days. Anything new to post or add as a certification?</div>`}`}
const CATS=['Task','Field Visit','Meeting','Admin'],IMP=['Low','Medium','High'],ST=['Completed','In Progress','Pending'];
function addLog(){form('New log',[{n:'date',t:'date',d:today()},{n:'category',o:CATS},{n:'title'},{n:'description',t:'area'},{n:'location'},{n:'impact',o:IMP,d:'Medium'},{n:'status',o:ST},{n:'hours',t:'number',d:'1'},{n:'result'}],async r=>{if(!r.title)return'Title is required';const l={id:uid('L'),...r,ts:Date.now()};S.logs.unshift(l);await apprCheck(l);await save();render();toast('Saved ✓')})}
async function apprCheck(l){if(l.status=='Completed'&&l.impact!='Low'&&!S.appr.find(a=>a.logId==l.id)){const prev=S.appr.length?S.appr.at(-1).hash:'GENESIS',rec={logId:l.id,date:l.date,title:l.title,impact:l.impact,result:l.result};S.appr.push({...rec,prev,hash:await sha(prev+JSON.stringify(rec))})}}
async function done(id){const l=S.logs.find(x=>x.id==id);l.status='Completed';await apprCheck(l);await save();render();toast('Nice work! 🎉')}
async function verify(){let p='GENESIS';for(const a of S.appr){const rec={logId:a.logId,date:a.date,title:a.title,impact:a.impact,result:a.result};if(a.prev!=p||a.hash!=await sha(p+JSON.stringify(rec)))return toast('⚠️ Chain broken at: '+a.title);p=a.hash}toast('✅ Appraisal log is intact')}
function eod(){const v=sub.eod||'logs',q=sub.f||'All';let L=S.logs.filter(l=>q=='All'||l.status==q);
return top('EOD & Tasks')+`<div class="tabs">${[['logs','Logs'],['appr','Career log']].map(t=>`<button class="btn sm ${v==t[0]?'':'gh'}" onclick="sub.eod='${t[0]}';render()">${t[1]}</button>`).join('')}</div>`+(v=='appr'?`<button class="btn gr sm" onclick="verify()">Verify log</button><button class="btn gh sm" onclick="dl('appraisal',S.appr)">Export</button>`+(S.appr.map(a=>`<div class="card"><span class="chip ${a.impact}">${a.impact}</span><b>${esc(a.title)}</b><div class="mu">${a.date} · ${esc(a.result)}</div><div class="mu">🔗 ${a.hash.slice(0,12)}…</div></div>`).join('')||'<div class="card mu">Completed Medium/High tasks appear here, hash-chained so edits are detectable.</div>'):
`<button class="btn" onclick="addLog()">+ New log</button><select onchange="sub.f=this.value;render()" style="width:auto">${['All',...ST].map(x=>`<option ${x==q?'selected':''}>${x}</option>`).join('')}</select>`+(L.map(l=>`<div class="card"><span class="chip ${l.impact}">${l.impact}</span><span class="chip ${l.status}">${l.status}</span><b>${esc(l.title)}</b><div class="mu">${l.date} · ${l.category} · ${l.hours}h ${esc(l.location)}</div><div>${esc(l.description)}</div>${l.result?`<div class="mu">Result: ${esc(l.result)}</div>`:''}${l.status!='Completed'?`<button class="btn gr sm" onclick="done('${l.id}')">Mark done</button>`:''}<button class="btn gh sm" onclick="del('logs','${l.id}')">Delete</button></div>`).join('')||'<div class="card mu">No logs yet. Add your first one!</div>'))}
async function del(k,id){if(!confirm('Delete this?'))return;S[k]=S[k].filter(x=>x.id!=id);await save();render()}
function addTerr(){form('Route entry',[{n:'date',t:'date',d:today()},{n:'territory'},{n:'route'},{n:'distributor'},{n:'target',l:'Target sales (BDT)',t:'number'},{n:'actual',l:'Actual sales (BDT)',t:'number'},{n:'stock',l:'Stock-out?',o:['N','Y']},{n:'items',l:'Stock-out items'}],async r=>{if(!r.route||!(+r.target>0))return'Route and a target above 0 are required';S.terr.unshift({id:uid('T'),...r});await save();render();toast('Saved ✓')})}
function terr(){const agg={};S.terr.forEach(r=>{const a=agg[r.route]||(agg[r.route]={t:0,a:0});a.t+=+r.target;a.a+=+r.actual});const mx=Math.max(1,...Object.values(agg).flatMap(a=>[a.t,a.a]));
return top('Territory')+`<button class="btn or" onclick="addTerr()">+ Route entry</button>`+alerts().filter(x=>!x.startsWith('Overdue')).map(x=>`<div class="alert">⚠️ ${esc(x)}</div>`).join('')+`<div class="card"><h3>Target vs Actual</h3>${Object.entries(agg).map(([k,a])=>`<div><b>${esc(k)}</b> <span class="mu">${Math.round(a.a/a.t*100)}%</span><div class="bar"><i class="t" style="width:${a.t/mx*100}%"></i></div><div class="bar"><i style="width:${a.a/mx*100}%;${a.a/a.t<.8?'background:var(--rd)':''}"></i></div></div>`).join('')||'<span class="mu">Add route entries to see the chart.</span>'}<div class="mu">🟧 Target · 🟦 Actual (red below 80%)</div></div>`+S.terr.slice(0,30).map(r=>`<div class="card"><b>${esc(r.route)}</b> ${r.stock=='Y'?'<span class="chip High">Stock-out</span>':''}<div class="mu">${r.date} · ${esc(r.territory)} · ${esc(r.distributor)}</div>${(+r.actual).toLocaleString()} / ${(+r.target).toLocaleString()} (${pct(r)}%)<br><button class="btn gh sm" onclick="del('terr','${r.id}')">Delete</button></div>`).join('')}
const STG=['Prospect','Doc Verification','Underwriting','Sanctioned'],DOCS=['Trade License','Audited Financials','TIN Certificate','Bank Statements','NID of Owners','Company Profile'];
function addLead(){form('New lead',[{n:'company',l:'Company / code name'},{n:'contact'},{n:'product'},{n:'amount',l:'Amount (BDT, optional)',t:'number'},{n:'action',l:'Next action'},{n:'next',l:'Next action date',t:'date'}],async r=>{if(!r.company)return'Company is required';const id=uid('P');S.leads.push({id,...r,stage:'Prospect',since:today()});S.docs[id]=DOCS.map(d=>({d,rec:0,ver:0}));await save();render()})}
async function mv(id,dir){const l=S.leads.find(x=>x.id==id),i=STG.indexOf(l.stage)+dir;if(i<0||i>3)return;if(STG[i]=='Underwriting'){const m=S.docs[id].filter(d=>!d.ver).map(d=>d.d);if(m.length)return toast('Missing verified: '+m.join(', '))}l.stage=STG[i];l.since=today();await save();render()}
async function dk(id,i,k){const d=S.docs[id][i];d[k]=d[k]?0:1;if(k=='ver'&&d.ver)d.rec=1;await save();render()}
function pipe(){return top('Pipeline')+`<button class="btn gr" onclick="addLead()">+ Lead</button><div class="cols">${STG.map(s=>`<div class="col"><h3>${s}</h3>${S.leads.filter(l=>l.stage==s).map(l=>{const days=Math.floor((Date.now()-new Date(l.since))/864e5),od=l.next&&l.next<today()&&s!='Sanctioned';return`<div class="card"><b>${esc(l.company)}</b><div class="mu">${days}d in stage${l.amount?` · ৳${(+l.amount).toLocaleString()}`:''}</div>${l.action?`<div class="${od?'alert':'mu'}">${esc(l.action)} · ${l.next}</div>`:''}<details><summary class="mu">Documents</summary>${S.docs[l.id].map((d,i)=>`<div class="row"><span class="sp">${d.d}</span><label><input type="checkbox" style="width:auto" ${d.rec?'checked':''} onchange="dk('${l.id}',${i},'rec')"> rec</label><label><input type="checkbox" style="width:auto" ${d.ver?'checked':''} onchange="dk('${l.id}',${i},'ver')"> ver</label></div>`).join('')}<div class="mu">Never store TIN/NID numbers here.</div></details>${s!='Prospect'?`<button class="btn gh sm" onclick="mv('${l.id}',-1)">◀</button>`:''}${s!='Sanctioned'?`<button class="btn sm" onclick="mv('${l.id}',1)">Next ▶</button>`:'🎉'}<button class="btn gh sm" onclick="del('leads','${l.id}')">✕</button></div>`}).join('')}</div>`).join('')}</div>`}
function summary(){const t=today(),L=S.logs.filter(l=>l.date==t),R=S.terr.filter(r=>r.date==t),dn=L.filter(l=>l.status=='Completed'),op=L.filter(l=>l.status!='Completed');let s=`EOD Report - ${t}\n\nCompleted tasks (${dn.length}):\n`+dn.map(l=>`- [${l.impact}] ${l.title}${l.result?' - '+l.result:''}`).join('\n')+`\n\nOpen items (${op.length}):\n`+op.map(l=>`- (${l.status}) ${l.title}`).join('\n');if(R.length){const T=R.reduce((a,r)=>a+ +r.target,0),A=R.reduce((a,r)=>a+ +r.actual,0);s+=`\n\nTerritory: actual ${A.toLocaleString()} vs target ${T.toLocaleString()} (${Math.round(A/T*100)}%)`+R.filter(r=>r.stock=='Y').map(r=>`\n- STOCK-OUT ${r.route}: ${r.items}`).join('')}return s}
function rep(){return top('Report')+`<div class="card"><h3>Today's EOD summary</h3><pre style="white-space:pre-wrap;font:inherit" id="sm">${esc(summary())}</pre></div><label>Send to (comma separated)</label><input id="to" value="${esc(S.mailTo)}" onchange="S.mailTo=this.value;save()" placeholder="manager@example.com"><button class="btn" onclick="gmail()">Open in Gmail</button><button class="btn gh" onclick="navigator.clipboard.writeText(summary()).then(()=>toast('Copied'))">Copy</button><div class="mu">Opens a ready-to-send Gmail draft. Automatic 6 pm sending needs the Python script from your roadmap, because a web page can't send email by itself.</div>`}
function gmail(){open(`https://mail.google.com/mail/?view=cm&to=${encodeURIComponent(S.mailTo)}&su=${encodeURIComponent('EOD Report - '+today())}&body=${encodeURIComponent(summary())}`,'_blank')}
/* ---- portfolio (LinkedIn-style) ---- */
const SEC={exp:['Experience',[{n:'role'},{n:'organization'},{n:'dates'},{n:'description',t:'area'}]],ach:['Achievements',[{n:'title'},{n:'issuer'},{n:'date'},{n:'description',t:'area'}]],proj:['Projects',[{n:'title'},{n:'description',t:'area'},{n:'link'}]],certs:['Licenses & Certifications',[{n:'title',l:'Course / certificate'},{n:'issuer'},{n:'date',t:'month'},{n:'link',l:'Credential link'}]],edu:['Education',[{n:'institution'},{n:'degree'},{n:'dates'},{n:'notes'}]],acts:['Extracurriculars',[{n:'activity'},{n:'role'},{n:'category'}]],skills:['Skills',[{n:'skill'},{n:'category'}]]};
function addSec(k,id){const e=id&&S[k].find(x=>x.id==id);form((e?'Edit ':'Add ')+SEC[k][0],SEC[k][1],async r=>{if(!Object.values(r)[0])return'First field is required';if(e)Object.assign(e,r);else S[k].unshift({id:uid('s'),...r});await save();render()},e||{})}
function editProf(){form('Edit profile',[{n:'avatar',l:'Profile photo',t:'file'},{n:'name'},{n:'headline'},{n:'summary',t:'area'},{n:'email'},{n:'location'}],async r=>{if(!r.avatar)r.avatar=S.profile.avatar;Object.assign(S.profile,r);await save();render()},S.profile)}
function addPost(){form('New post',[{n:'photo',l:'Photo',t:'file'},{n:'caption',t:'area',l:'What did you do?'}],async r=>{if(!r.caption&&!r.photo)return'Add a caption or photo';S.posts.unshift({id:uid('p'),ts:Date.now(),...r});await save();go('me');toast('Posted 🎉')})}
function editPost(id){const x=S.posts.find(p=>p.id==id);form('Edit post',[{n:'photo',l:'Replace photo (optional)',t:'file'},{n:'caption',t:'area'}],async r=>{x.caption=r.caption;if(r.photo)x.photo=r.photo;await save();render()},x)}
function me(){const p=S.profile,sec=k=>`<div class="card"><div class="row"><h3 class="sp">${SEC[k][0]}</h3><button class="btn gh sm" onclick="addSec('${k}')">+ Add</button></div>${S[k].map((x,i)=>{const v=Object.values(x).filter((y,j)=>j<4&&y&&!String(y).startsWith('s'));return`<div class="row" style="border-top:2px solid var(--ln);padding:8px 0"><div class="sp"><b>${esc(x[SEC[k][1][0].n])}</b><div class="mu">${esc(SEC[k][1].slice(1).map(f=>x[f.n]).filter(Boolean).join(' · '))}${x.link?` · <a href="${esc(x.link)}" target="_blank" rel="noopener">View</a>`:''}</div></div><button class="btn gh sm" onclick="addSec('${k}',${x.id?`'${x.id}'`:'null'})">${x.id?'✎':''}</button><button class="btn gh sm" onclick="S['${k}'].splice(${i},1);save();render()">✕</button></div>`}).join('')||'<div class="mu">Nothing yet.</div>'}</div>`;
return `<div class="top"><h1>Profile</h1><button class="btn gh sm" onclick="settings()">⚙️ Backup</button></div><div class="card" style="padding:0"><div class="cover"></div><div class="av pav" style="${p.avatar?`background-image:url(${p.avatar})`:''}">${p.avatar?'':esc(p.name[0])}</div><div style="padding:10px 14px 14px"><h2 style="margin:0">${esc(p.name)}</h2><div>${esc(p.headline)}</div><div class="mu">${esc(p.location)} ${esc(p.email)}</div><p>${esc(p.summary)}</p><button class="btn sm" onclick="editProf()">Edit profile</button><button class="btn or sm" onclick="addPost()">+ Post</button><button class="btn gh sm" onclick="print()">Print / PDF</button></div></div>`+sec('exp')+sec('edu')+sec('certs')+sec('skills')+sec('acts')+sec('ach')+sec('proj')+`<h3>Activity</h3>`+(S.posts.map(x=>`<div class="card"><div class="row"><div class="av" style="width:38px;height:38px;${p.avatar?`background-image:url(${p.avatar})`:''}">${p.avatar?'':esc(p.name[0])}</div><div class="sp"><b>${esc(p.name)}</b><div class="mu">${new Date(x.ts).toLocaleDateString()}</div></div><button class="btn gh sm" onclick="editPost('${x.id}')">✎</button><button class="btn gh sm" onclick="del('posts','${x.id}')">✕</button></div><div style="margin-top:8px;white-space:pre-wrap">${esc(x.caption)}</div>${x.photo?`<img class="pimg" src="${x.photo}" alt="">`:''}</div>`).join('')||'<div class="card mu">Share what you do: photos, wins, events.</div>')}
/* ---- backup ---- */
async function dl(name,data){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)]));a.download=name+'-'+today()+'.json';a.click()}
let tok=null,tokExp=0,pushT;const cid=()=>localStorage.getItem('apis_cid')||'';
function gtoken(ui){return new Promise((res,rej)=>{if(tok&&Date.now()<tokExp)return res(tok);if(!cid()||!window.google||!google.accounts)return rej('no client');const c=google.accounts.oauth2.initTokenClient({client_id:cid(),scope:'https://www.googleapis.com/auth/drive.appdata',callback:r=>{if(r.access_token){tok=r.access_token;tokExp=Date.now()+(r.expires_in-60)*1000;localStorage.setItem('apis_gd','1');res(tok)}else rej(r.error)},error_callback:e=>rej(e.type)});c.requestAccessToken({prompt:ui?'consent':''})})}
async function gf(url,o={}){const t=await gtoken();const r=await fetch(url,{...o,headers:{Authorization:'Bearer '+t,...(o.headers||{})}});if(!r.ok)throw new Error(r.status);return r}
async function fileId(){const r=await(await gf("https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name%3D'apis-data.json'&fields=files(id)")).json();return r.files[0]&&r.files[0].id}
async function push(){const id=await fileId(),b='apisb',m={name:'apis-data.json',...(id?{}:{parents:['appDataFolder']})};await gf('https://www.googleapis.com/upload/drive/v3/files'+(id?'/'+id:'')+'?uploadType=multipart',{method:id?'PATCH':'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body:`--${b}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(m)}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(S)}\r\n--${b}--`})}
async function pull(){const id=await fileId();if(!id)return push();const d=await(await gf('https://www.googleapis.com/drive/v3/files/'+id+'?alt=media')).json();if((d.updated||0)>(S.updated||0)){S={...DEF,...d};await persist();render();toast('Updated from Google Drive ☁️')}else if((d.updated||0)<(S.updated||0))return push()}
function settings(){$('#sheet').innerHTML=`<h3>Sync & backup</h3><p class="mu">Data is kept on this device and synced through a private app folder in your own Google Drive.</p><label>Google Client ID (one-time setup)</label><input id="cid" value="${esc(cid())}" placeholder="xxxx.apps.googleusercontent.com"><button class="btn" onclick="connect()">Connect Google Drive</button><button class="btn gr" onclick="syncNow()">Sync now</button><hr><button class="btn gh" onclick="dl('apis-backup',S)">Save backup file</button><label>Restore from file</label><input type="file" accept=".json" onchange="fromFile(this.files[0])"><button class="btn gh" onclick="closeM()">Close</button>`;$('#modal').classList.add('on')}
async function connect(){localStorage.setItem('apis_cid',$('#cid').value.trim());tok=null;try{await gtoken(true);await pull();toast('Drive connected ✓')}catch(e){toast('Could not connect. Check the Client ID')}}
async function syncNow(){try{await pull();await push();toast('Synced ✓')}catch(e){toast('Sync failed. Connect Drive first')}}
async function fromFile(f){try{S={...DEF,...JSON.parse(await f.text())};await save();closeM();render();toast('Restored ✓')}catch(e){toast('Not a valid backup file')}}
function render(){['certs','edu','acts','skills','exp','ach','proj'].forEach(k=>(S[k]||(S[k]=[])).forEach(x=>x.id||(x.id=uid('s'))));nav();$('#main').innerHTML={home,eod,terr,pipe,rep,me}[tab]()}
load().then(()=>{render();if(localStorage.getItem('apis_gd'))pull().catch(()=>{})});render();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
